name: ci

# GitHub Actions is billing-blocked for the organisation at the time of
# writing; the workflow is kept current so it runs the day it is enabled.
# Locally: `luacheck resources content tests tools`, `lua tests/unit/run.lua`,
# `lua tools/lang-check.lua`, `lua tools/lang-gen.lua --check`,
# `lua tools/config-doc.lua --check README.md`, `tools/get-server.ps1` then
# `python tests/gate/<name>_test.py`. The client half (the imgui panel) is
# plain Lua under resources/warden/client and needs no Node step.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  SERVER_VERSION: "1.4.1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: luacheck, unit, lang, config-doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches resource.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' resources/warden/resource.toml | head -n1)"
          [[ "$tag" == "$version" ]] || { echo "::error::tag $GITHUB_REF_NAME but resource.toml says $version"; exit 1; }

      - name: Install Lua 5.4 and luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.4 lua-check
          lua5.4 -v
          luacheck --version

      - name: luacheck
        run: luacheck resources content tests tools

      - name: The content zip's action JSON parses and calls the guarded global
        run: |
          python3 - <<'EOF'
          import json
          a = json.load(open("content/warden/lua/ge/extensions/core/input/actions/warden.json"))
          act = a["toggleWarden"]
          assert act["cat"] == "warden" and act["ctx"] == "tlua", act
          assert act["onDown"].startswith("if nodemp_wd then"), act["onDown"]
          assert "settings/inputmaps" not in str(a), "no default binding ships with the action"
          print("warden.json ok")
          EOF

      - name: Unit tests
        run: lua5.4 tests/unit/run.lua

      - name: Dictionaries agree
        run: lua5.4 tools/lang-check.lua

      - name: The panel's generated dictionary is current
        run: lua5.4 tools/lang-gen.lua --check

      - name: The README config tables match the schema
        run: |
          lua5.4 tools/config-doc.lua --check README.md en
          lua5.4 tools/config-doc.lua --check README.ru.md ru

  gate:
    name: gate (released Node-Server)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Node-Server ${{ env.SERVER_VERSION }}
        run: |
          chmod +x tools/get-server.sh
          tools/get-server.sh "$SERVER_VERSION"
          test -d .server/examples/chat || { echo "::error::the server archive carries no examples/chat"; exit 1; }

      - name: Run every gate
        env:
          WD_SERVER_BIN: ${{ github.workspace }}/.server/Node-Server
          WD_KEEP_TMP: "1"
        run: |
          set -uo pipefail
          status=0
          for t in tests/gate/*_test.py; do
            echo "::group::$t"
            if ! python "$t"; then
              echo "::error file=$t::$t failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-server-logs
          path: tests/gate/_tmp/**/server.log
          if-no-files-found: ignore
          retention-days: 7

  pack:
    name: pack warden-<version>.zip
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Pack
        run: |
          chmod +x tools/pack.sh
          tools/pack.sh
          ls -l dist/
          (cd dist && sha256sum -c warden-*.zip.sha256)
          unzip -l dist/warden-*.zip
          unzip -l dist/warden-*.zip | grep -q 'resources/warden/client/warden/panel.lua' \
            || { echo "::error::the archive carries no client half"; exit 1; }
          unzip -Z1 dist/warden-*.zip | grep -qx 'content/warden.zip' \
            || { echo "::error::the archive carries no content/warden.zip (the game action)"; exit 1; }
          unzip -p dist/warden-*.zip content/warden.zip > /tmp/warden-content.zip
          unzip -Z1 /tmp/warden-content.zip | grep -qx 'lua/ge/extensions/core/input/actions/warden.json' \
            || { echo "::error::content/warden.zip carries no input action"; exit 1; }
          unzip -Z1 /tmp/warden-content.zip | grep -qx 'scripts/warden/modScript.lua' \
            || { echo "::error::content/warden.zip carries no modScript"; exit 1; }
          for top in LICENSE NOTICE README.md README.ru.md CHANGELOG.md; do
            unzip -Z1 dist/warden-*.zip | grep -qx "$top" \
              || { echo "::error::the archive carries no $top at its root"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: warden-zip
          path: |
            dist/warden-*.zip
            dist/warden-*.zip.sha256
          if-no-files-found: error

  release:
    name: GitHub Release (tag vX.Y.Z)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [check, gate, pack]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: warden-zip
          path: artifact

      # pinned to a commit: softprops/action-gh-release v2.6.2
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: warden ${{ github.ref_name }}
          files: |
            artifact/dist/warden-*.zip
            artifact/dist/warden-*.zip.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
